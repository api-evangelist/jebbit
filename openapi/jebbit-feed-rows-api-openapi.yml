components:
  schemas:
    feed_rows:
      type: object
      properties:
        data:
          type: array
          items:
            type: feed_row
    feed_row:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
            attributes:
              type: object
              properties:
                feed_id:
                  type: string
                product_identifier:
                  type: string
                data:
                  type: json
              required:
              - product_identifier
              - feed_id
              - data
          required:
          - type
    feed_row_request:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
            attributes:
              type: object
              properties:
                feed_id:
                  type: string
                product_identifier:
                  type: string
                data:
                  type: json
              required:
