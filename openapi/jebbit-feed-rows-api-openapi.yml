          content:
            application/vnd.api+json:
              examples:
                example_0:
                  value:
                    data:
                      id: abc123
                      type: feed_row
                      attributes:
                        data: '{"hello":"world"}'
              schema:
                $ref: '#/components/schemas/feed_row'
        '400':
