  /api/v1/feeds/{feed_id}/feed_rows:
    get:
      summary: Retrieves Related Feed Rows
      tags:
      - Feeds
      security:
      - JWT: []
      parameters:
      - name: feed_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful
          content:
