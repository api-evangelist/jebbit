components:
  schemas:
    feed_request:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
            attributes:
              type: object
              properties:
                name:
                  type: string
              required:
              - name
              - source
              - status
          required:
          - type
    feed_rows:
      type: object
      properties:
        data:
          type: array
          items:
            type: feed_row
    feed:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
            attributes:
              type: object
              properties:
                name:
                  type: string
              required:
              - name
              - source
              - status
          required:
          - type
    feed_columns:
      type: object
      properties:
        data:
          type: array
          items:
            type: feed_column
    feeds:
      type: object
      properties:
        data:
          type: array
          items:
            type: feed
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      flows:
        authorizationCode:
          tokenUrl: https://auth.jebbit.com/oauth/token
          scopes:
            read: Grants read access
            write: Grants write access
            delete: Grants delete access
