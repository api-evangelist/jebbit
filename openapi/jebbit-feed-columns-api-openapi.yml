      summary: Lists feed columns
      tags:
      - Feed Columns
      security:
      - JWT: []
      parameters:
      - name: filter[feed_id]
        in: query
        required: true
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            description: Feed ID
      responses:
        '200':
          description: Successful
          content:
            application/vnd.api+json:
              examples:
                example_0:
                  value:
                    data:
                    - id: abc123
                      type: feed_columns
                      attributes:
                        name: Column 1
                    - id: def567
                      type: feed_columns
                      attributes:
                        name: Column 2
              schema:
                $ref: '#/components/schemas/feed_columns'
        '400':
          description: Bad Request
          content:
            application/vnd.api+json:
              examples:
                example_0:
                  value:
                    errors:
                    - status: 400
                      title: Bad Request
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              examples:
                example_0:
                  value:
                    errors:
                    - status: 401
                      title: Unauthorized Request
        '403':
          description: Forbidden
          content:
            application/vnd.api+json:
              examples:
                example_0:
                  value:
                    errors:
                    - status: 403
                      title: Forbidden
