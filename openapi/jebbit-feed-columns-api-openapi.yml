components:
  schemas:
    feed_column_request:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
            attributes:
              type: object
              properties:
                name:
                  type: string
              required:
              - name
              - feed_id
          required:
          - type
    feed_columns:
      type: object
      properties:
        data:
          type: array
          items:
            type: feed_column
    feed_column:
      type: object
