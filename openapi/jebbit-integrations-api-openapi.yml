components:
  schemas:
    integration:
      type: object
      properties:
        data:
          type: object
          properties:
            id:
              type: string
            type:
              type: string
            attributes:
              type: object
              properties:
                endpoint:
                  type:
                  - string
                  - 'null'
                include_uids:
                  type: boolean
                region:
                  type:
                  - string
                  - 'null'
                require_opt_in:
                  type:
                  - boolean
                  - 'null'
                created_at:
                  type: date
                updated_at:
                  type: date
                service_name:
                  type: string
                shared_secret:
                  type: string
                include_mapped_attributes:
                  type:
                  - boolean
                  - 'null'
              required:
              - endpoint
              - service_name
              - shared_secret
          required:
          - type
    integration_request:
      type: object
      properties:
        data:
          type: object
          properties:
            type:
              type: string
              default: integrations
            attributes:
              type: object
              properties:
                endpoint:
                  type: string
                region:
                  type: string
                  default: us
                additional_options:
                  type: object
                  properties:
                    campaign_name_filter:
                      type: string
                    include_url_params:
                      type: boolean
                    include_sub_channel:
                      type: boolean
                    include_outcome_names:
                      type: boolean
                    require_outcomes:
                      type: boolean
                    hash_pii:
                      type: boolean
    integrations:
      type: object
      properties:
        data:
          type: array
          items:
            type: integration
  securitySchemes:
    JWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      flows:
        authorizationCode:
          tokenUrl: https://auth.jebbit.com/oauth/token
          scopes:
            read: Grants read access
            write: Grants write access
            delete: Grants delete access
