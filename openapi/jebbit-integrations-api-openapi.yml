      summary: integrations
      tags:
      - Integrations
      security:
      - JWT: []
      responses:
        '200':
          description: Successful
          content:
            application/vnd.api+json:
              examples:
                example_0:
                  value:
                    data:
                    - id: abc123
                      type: integrations
                      attributes:
                        endpoint: https://www.example.com/webhook
                        service_name: webhook
                    - id: def567
                      type: integrations
                      attributes:
                        endpoint: https://www.example.com/webhook2
                        service_name: webhook
              schema:
                $ref: '#/components/schemas/integrations'
        '401':
          description: Unauthorized
          content:
            application/vnd.api+json:
              examples:
                example_0:
                  value:
                    errors:
                    - status: 401
                      title: Unauthorized Request
        '403':
          description: forbidden
          content:
            application/vnd.api+json:
              examples:
                example_0:
                  value:
                    errors:
                    - status: 403
                      title: Forbidden
