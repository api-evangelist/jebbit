aid: jebbit
name: Jebbit
description: Jebbit — now BlueConic Experiences — is an interactive experience platform that captures
  zero- and first-party declared data from consumers through quizzes, product finders, personality tests,
  and preference flows that shoppers complete because the experience gives them value in return. Responses
  sync into customer profiles and activate across the marketing stack in real time. Jebbit exposes a public
  JSON:API REST API (https://api2.jebbit.com) for managing businesses, campaigns, launch links, dynamic
  product feeds, and webhook integrations that stream user session data, secured with OAuth 2.0 client-credentials
  JWTs and HMAC-signed webhooks.
